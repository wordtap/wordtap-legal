<!DOCTYPE html>
<html lang="{{ page.lang | default: 'ru' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}WordTap</title>
  <meta name="description" content="{{ page.description | default: 'WordTap' }}">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  {% assign ru = page.lang != 'en' %}
  <header class="top">
    <div class="wrap bar">
      <a class="brand" href="{% if ru %}{{ '/' | relative_url }}{% else %}{{ '/en/' | relative_url }}{% endif %}">Word<span>Tap</span></a>
      <nav>
        {% if ru %}
        <a href="{{ '/privacy/' | relative_url }}">Конфиденциальность</a>
        <a href="{{ '/terms/' | relative_url }}">Условия</a>
        <a href="{{ '/credits/' | relative_url }}">Авторы</a>
        {% else %}
        <a href="{{ '/en/privacy/' | relative_url }}">Privacy</a>
        <a href="{{ '/en/terms/' | relative_url }}">Terms</a>
        <a href="{{ '/en/credits/' | relative_url }}">Credits</a>
        {% endif %}
        {% if page.alt %}<a class="lang" href="{{ page.alt | relative_url }}">{% if ru %}English{% else %}Русский{% endif %}</a>{% endif %}
      </nav>
    </div>
  </header>

  <main class="wrap doc">
    {{ content }}
  </main>

  <footer class="wrap foot">
    <span>© 2026 WordTap</span>
  </footer>
</body>
</html>
